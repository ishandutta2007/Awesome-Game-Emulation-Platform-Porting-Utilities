<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="40%" stop-color="#111827" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Cyber Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.25)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.25)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.2)" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes scanline {
        0% { transform: translateY(-420px); }
        100% { transform: translateY(420px); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1deg); }
      }
      .orb-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 200px 100px; }
      .orb-2 { animation: pulseGlow 8s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
      .float-item-1 { animation: floatSlow 7s ease-in-out infinite; }
      .float-item-2 { animation: floatReverse 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Ambient Orbs (Background layer) -->
  <g class="orb-1">
    <circle cx="180" cy="100" r="180" fill="#6366f1" opacity="0.18" filter="url(#glowPurple)" />
  </g>
  <g class="orb-2">
    <circle cx="1020" cy="300" r="220" fill="#06b6d4" opacity="0.16" filter="url(#glowCyan)" />
  </g>

  <!-- Dynamic Futuristic Cyber Elements (Background & Side Decor) -->
  <g opacity="0.35" class="float-item-2">
    <!-- Retro Gamepad Outline Wireframe -->
    <path d="M960,110 C930,110 905,130 895,160 L870,240 C860,270 880,300 910,300 C925,300 938,292 945,280 L965,245 L995,245 L1015,280 C1022,292 1035,300 1050,300 C1080,300 1100,270 1090,240 L1065,160 C1055,130 1030,110 1000,110 Z" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,4" />
    <!-- D-pad & Buttons -->
    <path d="M920,185 L940,185 M930,175 L930,195" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="1035" cy="180" r="4" fill="#f43f5e" />
    <circle cx="1050" cy="195" r="4" fill="#eab308" />
    <circle cx="1020" cy="195" r="4" fill="#3b82f6" />
    <circle cx="1035" cy="210" r="4" fill="#22c55e" />
  </g>

  <!-- Tech Geometric Accent Hexagons & Chips (Left side) -->
  <g opacity="0.3" class="float-item-1">
    <polygon points="120,240 150,225 180,240 180,270 150,285 120,270" fill="none" stroke="#38bdf8" stroke-width="2" />
    <polygon points="70,180 95,167 120,180 120,205 95,217 70,205" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,2" />
    <line x1="150" y1="285" x2="150" y2="340" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3,3" />
    <circle cx="150" cy="340" r="3" fill="#00f2fe" />
  </g>

  <!-- High-Tech Header / Badge -->
  <g transform="translate(425, 45)">
    <rect x="0" y="0" width="350" height="34" rx="17" fill="url(#badgeGrad)" stroke="rgba(168, 85, 247, 0.45)" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#22c55e" filter="url(#glowCyan)" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="1.5">AWESOME UTILITIES &amp; ECOSYSTEM</text>
  </g>

  <!-- Central Title (Foreground - Clear & Unobstructed) -->
  <g id="title-group">
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      GAME EMULATION &amp; PLATFORM PORTING
    </text>
    <!-- Cyan/Purple Accent Glow Bar Under Title -->
    <rect x="360" y="165" width="480" height="4" rx="2" fill="url(#neonCyan)" filter="url(#glowCyan)" />
  </g>

  <!-- Subtitle (Foreground - Crisp Contrast) -->
  <g id="subtitle-group">
    <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      Curated Multi-System Frontends • Porting &amp; Translation Layers • Retro OS &amp; Streaming
    </text>
  </g>

  <!-- Feature Pills Badges (Interactive look, cleanly laid out) -->
  <g transform="translate(600, 280)">
    <!-- Pill 1: Emulation Cores -->
    <g transform="translate(-460, 0)">
      <rect x="0" y="0" width="165" height="40" rx="20" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
      <text x="82" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🕹️ Core Emulators</text>
    </g>

    <!-- Pill 2: Wine / Proton / DXVK -->
    <g transform="translate(-275, 0)">
      <rect x="0" y="0" width="175" height="40" rx="20" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" />
      <text x="87" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c084fc">🍷 Translation Layers</text>
    </g>

    <!-- Pill 3: Apple Silicon & ARM -->
    <g transform="translate(-80, 0)">
      <rect x="0" y="0" width="170" height="40" rx="20" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.5" />
      <text x="85" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f472b6">⚡ Apple Silicon &amp; ARM</text>
    </g>

    <!-- Pill 4: Retro OS Distros -->
    <g transform="translate(110, 0)">
      <rect x="0" y="0" width="165" height="40" rx="20" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1.5" />
      <text x="82" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#4ade80">💾 Retro OS Distros</text>
    </g>

    <!-- Pill 5: Cloud & Moonlight -->
    <g transform="translate(295, 0)">
      <rect x="0" y="0" width="165" height="40" rx="20" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(251, 146, 60, 0.4)" stroke-width="1.5" />
      <text x="82" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fb923c">📡 Low-Latency Stream</text>
    </g>
  </g>

  <!-- Bottom Border Line Glow -->
  <line x1="0" y1="419" x2="1200" y2="419" stroke="url(#neonPurple)" stroke-width="2" opacity="0.6" />
</svg>
